name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Valider la banque de questions
        run: npm run validate
      - name: Vérifier les modules (syntaxe et imports Node)
        run: npm run check
      - name: Tests unitaires
        run: npm run test:unit
