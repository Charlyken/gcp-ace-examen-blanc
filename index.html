<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examen blanc GCP ACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Chargées à part : si l'une manque, la pile de polices retombe sur Roboto -->
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Plan de design : esprit Material (Google). Surfaces blanches sur fond bleuté
   très clair, quatre couleurs primaires en accents géométriques, boutons pilule,
   cartes à grands rayons, ombres douces. Une colonne de lecture (max 860px).
   ========================================================================== */
:root {
  --bg: #f8fafd;
  --surface: #ffffff;
  --surface-2: #f1f3f4;
  --ink: #202124;
  --muted: #5f6368;
  --line: #dadce0;
  --accent: #1a73e8;      --accent-soft: #e8f0fe;  --on-accent: #ffffff;
  --good: #188038;        --good-soft: #e6f4ea;
  --bad: #d93025;         --bad-soft: #fce8e6;
  --warn: #b06000;        --warn-soft: #fef7e0;
  /* Quatuor décoratif + violet pour le 5e domaine */
  --g-blue: #4285f4; --g-red: #ea4335; --g-yellow: #fbbc04; --g-green: #34a853; --g-purple: #a142f4;
  --shadow-1: 0 1px 2px rgba(60,64,67,.22), 0 1px 3px 1px rgba(60,64,67,.10);
  --shadow-2: 0 2px 4px rgba(60,64,67,.22), 0 6px 14px 4px rgba(60,64,67,.12);
  --font-display: "Google Sans", "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Google Sans Code", "Roboto Mono", ui-monospace, Menlo, monospace;
  --radius: 24px;
  --ease: cubic-bezier(.2, 0, 0, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1b1c1f; --surface: #26282c; --surface-2: #303236; --ink: #e8eaed; --muted: #9aa0a6; --line: #41454a;
    --accent: #8ab4f8; --accent-soft: #263348; --on-accent: #1b1c1f;
    --good: #81c995; --good-soft: #1d3325;
    --bad: #f28b82;  --bad-soft: #3d2422;
    --warn: #fdd663; --warn-soft: #3a3114;
    --shadow-1: 0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.3);
    --shadow-2: 0 2px 4px rgba(0,0,0,.5), 0 6px 14px 4px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1b1c1f; --surface: #26282c; --surface-2: #303236; --ink: #e8eaed; --muted: #9aa0a6; --line: #41454a;
  --accent: #8ab4f8; --accent-soft: #263348; --on-accent: #1b1c1f;
  --good: #81c995; --good-soft: #1d3325;
  --bad: #f28b82;  --bad-soft: #3d2422;
  --warn: #fdd663; --warn-soft: #3a3114;
  --shadow-1: 0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.3);
  --shadow-2: 0 2px 4px rgba(0,0,0,.5), 0 6px 14px 4px rgba(0,0,0,.35);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.2; margin: 0; font-weight: 500; }
h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: -.01em; }
h2 { font-size: 1.3rem; }
p { margin: 0; }
code { font-family: var(--font-mono); font-size: .86em; background: var(--surface-2); padding: .1em .4em; border-radius: 6px; overflow-wrap: anywhere; }
svg.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.sr { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }

/* Domaines : une couleur chacun */
.d1 { --dc: var(--g-blue); } .d2 { --dc: var(--g-red); } .d3 { --dc: var(--g-yellow); } .d4 { --dc: var(--g-green); } .d5 { --dc: var(--g-purple); }

.strip { height: 4px; background: linear-gradient(90deg, var(--g-blue) 0 25%, var(--g-red) 25% 50%, var(--g-yellow) 50% 75%, var(--g-green) 75%); }
.wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 72px; display: flex; flex-direction: column; gap: 20px; }
.card { background: var(--surface); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow-1); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spread { justify-content: space-between; }

/* --- Animations d'entrée (partent d'un état visible à la fin) --- */
@keyframes rise   { from { opacity: 0; transform: translateY(6px); } }
@keyframes inNext { from { opacity: 0; transform: translateX(10px); } }
@keyframes inPrev { from { opacity: 0; transform: translateX(-10px); } }
@keyframes pop    { from { opacity: 0; transform: scale(.96); } }
@keyframes grow   { from { width: 0; } }
@keyframes ring   { from { stroke-dashoffset: var(--c); } }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }
@keyframes drop   { from { opacity: 0; transform: translateY(-8px); } }
.stagger > * { animation: rise .3s var(--ease) backwards; }
.stagger > :nth-child(2) { animation-delay: .04s; } .stagger > :nth-child(3) { animation-delay: .08s; }
.stagger > :nth-child(n+4) { animation-delay: .12s; }
.enter-next { animation: inNext .2s var(--ease); }
.enter-prev { animation: inPrev .2s var(--ease); }

/* --- Boutons --- */
.btn {
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 500 .95rem var(--font-display); cursor: pointer; letter-spacing: .01em;
  border: 1px solid var(--line); background: var(--surface); color: var(--accent);
  padding: 10px 22px; border-radius: 999px; min-height: 44px;
  transition: box-shadow .2s, background .2s, transform .15s var(--ease), border-color .2s;
}
.btn:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent); border-color: var(--accent); box-shadow: var(--shadow-2); }
.btn-ghost { border-color: transparent; background: transparent; padding-inline: 14px; }
.btn-flag[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn-soft); color: var(--warn); }
.btn-flag[aria-pressed="true"] svg { fill: currentColor; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .1; transform: scale(0); animation: ripple .45s ease-out forwards; pointer-events: none; }

/* --- Accueil : bandeau d'ouverture --- */
.hero {
  position: relative; overflow: hidden; border-radius: 32px; padding: 36px 32px;
  background: var(--accent-soft); display: grid; grid-template-columns: 1fr 260px; gap: 24px; align-items: center;
}
.hero-text { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.hero p { max-width: 46ch; }
.badge-top { display: inline-flex; gap: 8px; align-items: center; background: var(--surface); color: var(--accent); font: 500 .8rem var(--font-display); padding: 6px 14px; border-radius: 999px; }
.badge-top i { width: 8px; height: 8px; border-radius: 50%; background: var(--g-green); }
.art { position: relative; height: 220px; }
.shape { position: absolute; translate: calc(var(--px, 0) * var(--k, 10px)) calc(var(--py, 0) * var(--k, 10px)); transition: translate .8s var(--ease); }
.s1 { width: 124px; height: 124px; border-radius: 50%; background: var(--g-blue); left: 18px; top: 22px; --k: 5px; }
.s2 { width: 92px; height: 92px; border-radius: 100% 0 0 0; background: var(--g-red); right: 14px; top: 6px; --k: -6px; }
.s3 { width: 72px; height: 72px; border-radius: 16px; background: var(--g-yellow); right: 40px; bottom: 26px; rotate: 14deg; --k: 8px; }
.s4 { width: 132px; height: 44px; border-radius: 999px; background: var(--g-green); left: 0; bottom: 10px; --k: -4px; }
.s5 { width: 40px; height: 40px; border-radius: 50%; border: 8px solid var(--g-blue); left: 150px; top: 96px; --k: 10px; opacity: .85; }

.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; }
.mode { transition: box-shadow .25s, transform .25s var(--ease); }
.mode:hover { box-shadow: var(--shadow-2); }
.mode-ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.mode-ic svg { width: 26px; height: 26px; }
.mode-ic.green { background: var(--good-soft); color: var(--good); }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: .85rem; color: var(--muted); }
.fact b { color: var(--ink); font-family: var(--font-mono); font-weight: 500; }
.note { background: var(--surface-2); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; }
.chip span { position: relative; overflow: hidden; display: inline-flex; gap: 6px; align-items: center; padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; font-size: .875rem; cursor: pointer; background: var(--surface); color: var(--muted); transition: background .2s, color .2s, border-color .2s; }
.chip span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dc, var(--accent)); transition: transform .2s var(--ease); }
.chip input:checked + span { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent); font-weight: 500; }
.chip input:checked + span::before { transform: scale(1.35); }
.chip input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

.dlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.drow { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; align-items: center; }
.dnum { width: 30px; height: 30px; border-radius: 50%; background: var(--dc); color: #fff; display: grid; place-items: center; font: 500 .85rem var(--font-display); }
.d3 .dnum { color: #202124; }
.wbar { grid-column: 2 / -1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.wbar i { display: block; height: 100%; border-radius: 3px; background: var(--dc); animation: grow .6s var(--ease) backwards; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid var(--line); }
th { font-weight: 500; color: var(--muted); font-size: .8rem; }
td.r, th.r { text-align: right; }

/* --- Bandeau de session --- */
.topbar { position: sticky; top: 0; z-index: 5; background: var(--surface); box-shadow: var(--shadow-1); }
.topbar-in { max-width: 860px; margin: 0 auto; padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
.topbar strong { font: 500 1.05rem var(--font-display); }
.timer { display: inline-flex; align-items: center; gap: 8px; font: 500 1.05rem var(--font-mono); font-variant-numeric: tabular-nums; background: var(--accent-soft); color: var(--accent); padding: 6px 14px; border-radius: 999px; }
.timer.low { background: var(--bad-soft); color: var(--bad); }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .45s var(--ease); }

/* --- Question --- */
.tag { display: inline-flex; align-items: center; gap: 6px; font: 500 .8rem var(--font-display); padding: 4px 12px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tag.dtag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dc); }
.tag.multi { background: var(--warn-soft); color: var(--warn); }
.qcard { padding: 28px; gap: 20px; }
.qtext { font: 400 1.2rem/1.5 var(--font-display); }
.options { display: flex; flex-direction: column; gap: 10px; border: 0; padding: 0; margin: 0; min-width: 0; }
.opt {
  position: relative; overflow: hidden; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center;
  padding: 12px 16px; border: 1px solid var(--line); border-radius: 16px; cursor: pointer; background: var(--surface);
  transition: border-color .2s, background .2s, transform .15s var(--ease), box-shadow .2s;
}
.opt:not(.locked):hover { border-color: var(--accent); }
.opt .letter { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 500 .9rem var(--font-display); background: var(--surface-2); color: var(--muted); transition: background .2s, color .2s; }
.opt.sq .letter { border-radius: 10px; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.opt:has(input:checked) .letter { background: var(--accent); color: var(--on-accent); }
.opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt.locked { cursor: default; }
.opt.is-correct { border-color: var(--good); background: var(--good-soft); box-shadow: inset 0 0 0 1px var(--good); }
.opt.is-correct .letter { background: var(--good); color: var(--surface); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: inset 0 0 0 1px var(--bad); }
.opt.is-wrong .letter { background: var(--bad); color: var(--surface); }
.opt .verdict { display: block; font-size: .8rem; font-weight: 500; margin-top: 2px; }
.opt.is-correct .verdict { color: var(--good); } .opt.is-wrong .verdict { color: var(--bad); }
.feedback { padding: 16px 18px; background: var(--surface-2); border-radius: 16px; display: flex; flex-direction: column; gap: 6px; animation: drop .35s var(--ease); }
.feedback > strong { display: inline-flex; align-items: center; gap: 8px; font: 500 1rem var(--font-display); }
.feedback.ok { background: var(--good-soft); } .feedback.ok > strong { color: var(--good); }
.feedback.ko { background: var(--bad-soft); }  .feedback.ko > strong { color: var(--bad); }

/* --- Grille de navigation --- */
.nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 8px; }
.nav-grid button { position: relative; overflow: hidden; font: 500 .85rem var(--font-mono); height: 42px; border: 1px solid var(--line); border-radius: 50%; aspect-ratio: 1; justify-self: center; background: var(--surface); color: var(--muted); cursor: pointer; transition: transform .15s var(--ease), background .2s; }
.nav-grid button:hover { border-color: var(--accent); }
.nav-grid button.answered { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.nav-grid button.ok { background: var(--good-soft); color: var(--good); border-color: transparent; }
.nav-grid button.ko { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.nav-grid button.current { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.nav-grid button.flagged { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--g-yellow); overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
summary { cursor: pointer; font: 500 1rem var(--font-display); }

/* --- Résultats --- */
.score { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; }
.ringbox { position: relative; width: 168px; height: 168px; }
.ringbox svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ringbox circle { fill: none; stroke-width: 12; }
.ring-bg { stroke: var(--surface-2); }
.ring-fg { stroke-linecap: round; animation: ring .7s var(--ease) backwards; }
.ring-fg.ok { stroke: var(--good); } .ring-fg.ko { stroke: var(--bad); }
.ringbox .big { position: absolute; inset: 0; display: grid; place-items: center; font: 500 2.3rem var(--font-display); font-variant-numeric: tabular-nums; }
.score-side { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 999px; font: 500 .9rem var(--font-display); }
.pill svg { width: 16px; height: 16px; }
.pill.ok { background: var(--good-soft); color: var(--good); } .pill.ko { background: var(--bad-soft); color: var(--bad); }
.dom { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; align-items: center; }
.dom .bar { grid-column: 1 / -1; height: 12px; border-radius: 6px; position: relative; overflow: visible; }
.dom .bar > i { border-radius: 6px; animation: grow .6s var(--ease) backwards; transition: none; }
.dom .bar > i.ok { background: var(--good); } .dom .bar > i.ko { background: var(--bad); }
.dom .bar::after { content: ""; position: absolute; left: 70%; top: -4px; bottom: -4px; width: 2px; border-radius: 1px; background: var(--ink); opacity: .6; }
.review-item { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); transition: box-shadow .2s; }
.review-item[open], .review-item:hover { box-shadow: var(--shadow-1); }
.review-item > summary { padding: 14px 16px; display: flex; gap: 10px; align-items: baseline; font: 400 .98rem var(--font-body); }
.review-item > summary .st { font: 500 .78rem var(--font-display); white-space: nowrap; padding: 2px 10px; border-radius: 999px; }
.st.ok { color: var(--good); background: var(--good-soft); } .st.ko { color: var(--bad); background: var(--bad-soft); }
.review-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; animation: drop .3s var(--ease); }
.review-body ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.review-body li { padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; font-size: .94rem; }
.review-body li.is-correct { border-color: var(--good); background: var(--good-soft); }
.review-body li.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.review-body li small { font-weight: 500; display: block; }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

/* --- Mode examen : interface dépouillée, proche d'un centre d'examen --- */
.exam .strip { display: none; }
.exam .card { box-shadow: none; border: 1px solid var(--line); border-radius: 12px; animation: none; }
.exam .opt { border-radius: 8px; }
.exam .qtext { font-family: var(--font-body); }
.plist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.plist button { width: 100%; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; text-align: left; }
.plist button:hover { border-color: var(--accent); }
.plist button > :first-child { flex: 1; }
.plist .st { font: 500 .78rem var(--font-display); padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.st.flag { background: var(--warn-soft); color: var(--warn); }
.kbd-hint { text-align: center; }
@media (hover: none) { .kbd-hint { display: none; } }

/* --- Boîte de dialogue --- */
.overlay { position: fixed; inset: 0; background: rgba(32, 33, 36, .6); display: grid; place-items: center; padding: 16px; z-index: 20; animation: drop .2s; }
.dialog { background: var(--surface); border-radius: 28px; padding: 24px; max-width: 440px; width: 100%; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow-2); animation: pop .18s var(--ease); }

@media (max-width: 640px) {
  .hero { grid-template-columns: 1fr; padding: 24px 20px; border-radius: 24px; }
  .art { height: 120px; order: -1; scale: .62; transform-origin: left top; width: 260px; margin-bottom: -40px; }
  .card { padding: 18px; border-radius: 20px; } .qcard { padding: 20px 16px; }
  .qtext { font-size: 1.08rem; }
  .actions .btn { flex: 1 1 45%; padding-inline: 12px; }
  .score { grid-template-columns: 1fr; justify-items: center; text-align: center; } .score-side { align-items: center; }
  .dom { grid-template-columns: auto 1fr; } .dom .res { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div id="app"></div>
<div id="overlay" class="overlay" hidden></div>

<!-- ==========================================================================
     1. BANQUE DE QUESTIONS — c'est le seul bloc à éditer pour ajouter du contenu.

     Format d'une question :
       {
         id: "d3-17",              // identifiant UNIQUE (ne jamais réutiliser un id)
         domain: 3,                // 1 à 5, voir DOMAINS ci-dessous
         q: "Énoncé…",             // texte ; `entre backticks` = affiché en code
         options: ["…", "…"],      // 4 ou 5 options (elles sont mélangées à l'affichage)
         correct: [0],             // index (base 0) de la ou des bonnes réponses
                                   //   1 index  -> réponse unique (boutons radio)
                                   //   2+ index -> réponses multiples (cases à cocher)

<!-- ==========================================================================
     2. APPLICATION — logique d'examen, rendu et sauvegarde locale.
     ========================================================================== -->
<script>
(function () {
  "use strict";

  /* ---------------- Réglages ---------------- */
  const CONFIG = {
    examSize: 50,          // nombre de questions de l'examen blanc
    examMinutes: 120,      // durée du chronomètre
    passPct: 70,           // seuil de réussite indicatif
    lowTimeMs: 10 * 60000  // le chrono passe en rouge sous ce délai
  };
  const KEYS = { exam: "ace.session.exam", practice: "ace.session.practice", history: "ace.history", stats: "ace.stats" };
  const LETTERS = "ABCDE";
  const Q_BY_ID = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
  const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------- Icônes (SVG en ligne) ---------------- */
  const svg = p => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
  const IC = {
    clock: svg('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>'),
    target: svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'),
    check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
    cross: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
    flag: svg('<path d="M5 21V4h11l-1.5 4 1.5 4H5"/>'),
    next: svg('<path d="M5 12h14M13 6l6 6-6 6"/>'),
    prev: svg('<path d="M19 12H5M11 6l-6 6 6 6"/>')
  };

  /* ---------------- Stockage local (peut être indisponible) ---------------- */
  const store = {
    get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* on continue en mémoire */ } },
    del(key) { try { localStorage.removeItem(key); } catch (e) {} }
  };

  // Dernier résultat connu par question, toutes sessions confondues : { id: { n: essais, ok: bool } }
  let stats = store.get(KEYS.stats) || {};
  function record(id, ok) { const p = stats[id] || { n: 0 }; stats[id] = { n: p.n + 1, ok: !!ok }; }
  const saveStats = () => store.set(KEYS.stats, stats);

  /* ---------------- Utilitaires ---------------- */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");   // `texte` -> <code>
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const sameSet = (a, b) => a.length === b.length && a.slice().sort().join() === b.slice().sort().join();
  const clock = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0"); };
  const pct = (n, d) => d ? Math.round(n / d * 100) : 0;
  const isCorrect = (q, answer) => sameSet(q.correct, answer || []);

  /* ---------------- État ---------------- */
  let view = "home";       // home | quiz | results
  let session = null;      // session en cours d'affichage
  let timerId = null, endTime = 0;
  let reviewFilter = "wrong";
  let preFilter = "all";   // filtre de l'écran de vérification avant envoi
  let slide = "";          // sens de l'animation de la prochaine question : "next" | "prev" | ""
  let celebrate = false;   // lance compteur + confettis au premier affichage des résultats
  const app = document.getElementById("app");
  const overlay = document.getElementById("overlay");

  /* ---------------- Création de session ---------------- */
  // Tirage de l'examen : réparti par domaine selon DOMAINS[*].weight (méthode du plus fort reste).
  function drawExam() {
    const size = Math.min(CONFIG.examSize, QUESTIONS.length);
    const ids = Object.keys(DOMAINS).map(Number);
    const pools = Object.fromEntries(ids.map(d => [d, shuffle(QUESTIONS.filter(q => q.domain === d))]));
    const totalW = ids.reduce((s, d) => s + DOMAINS[d].weight, 0);
    const quota = {}; let used = 0;
    const rests = ids.map(d => {
      const exact = size * DOMAINS[d].weight / totalW;
      quota[d] = Math.min(Math.floor(exact), pools[d].length); used += quota[d];
      return { d, r: exact - Math.floor(exact) };
    }).sort((a, b) => b.r - a.r);
    let guard = 0;
    while (used < size && guard++ < 500) {
      const { d } = rests[(guard - 1) % rests.length];
      if (quota[d] < pools[d].length) { quota[d]++; used++; }
    }
    return shuffle(ids.flatMap(d => pools[d].slice(0, quota[d])));
  }

  function newSession(mode, questions, domains) {
    const order = {};
    questions.forEach(q => { order[q.id] = shuffle(q.options.map((_, i) => i)); });
    return {
      mode, ids: questions.map(q => q.id), order,
      answers: {}, validated: {}, flags: {}, current: 0,
      remainingMs: mode === "exam" ? CONFIG.examMinutes * 60000 : null,
      domains: domains || null, finished: false, startedAt: Date.now()
    };
  }
  // Ignore une session sauvegardée dont des questions ont été retirées de la banque.
  function loadSession(mode) {
    const s = store.get(KEYS[mode]);
    if (!s || !Array.isArray(s.ids) || !s.ids.length || s.ids.some(id => !Q_BY_ID[id] || !s.order || !s.order[id] || s.order[id].length !== Q_BY_ID[id].options.length)) return null;
    return s;
  }
  function save() {
    if (!session) return;
    if (session.mode === "exam" && !session.finished && endTime) session.remainingMs = Math.max(0, endTime - Date.now());
    store.set(KEYS[session.mode], session);
  }

  /* ---------------- Chronomètre ---------------- */
  function startTimer() {
    stopTimer();
    if (!session || session.mode !== "exam" || session.finished) return;
    endTime = Date.now() + session.remainingMs;
    let ticks = 0;
    timerId = setInterval(() => {
      const left = endTime - Date.now();
      const el = document.getElementById("timer"), txt = document.getElementById("timer-txt");
      if (txt) txt.textContent = clock(left);
      if (el) el.classList.toggle("low", left < CONFIG.lowTimeMs);
      if (++ticks % 5 === 0) save();
      if (left <= 0) finish(true);
    }, 1000);
  }
  function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; endTime = 0; }

  /* ---------------- Calcul des résultats ---------------- */
  function compute(s) {
    // En entraînement, seules les questions validées comptent.
    const ids = s.mode === "exam" ? s.ids : s.ids.filter(id => s.validated[id]);
    const byDomain = {};
    Object.keys(DOMAINS).forEach(d => byDomain[d] = { ok: 0, total: 0 });
    const items = ids.map(id => {
      const q = Q_BY_ID[id], a = s.answers[id] || [];
      const status = !a.length ? "empty" : isCorrect(q, a) ? "ok" : "ko";
      byDomain[q.domain].total++; if (status === "ok") byDomain[q.domain].ok++;
      return { id, q, a, status, flagged: !!s.flags[id] };
    });
    const ok = items.filter(i => i.status === "ok").length;
    return { items, ok, total: items.length, pct: pct(ok, items.length), byDomain };
  }

  function finish(timeUp) {
    if (!session || session.finished) return;
    if (session.mode === "exam" && endTime) session.remainingMs = Math.max(0, endTime - Date.now());
    stopTimer();
    session.finished = true; session.timeUp = !!timeUp; session.finishedAt = Date.now();
    store.set(KEYS[session.mode], session);
    if (session.mode === "exam") {
      const r = compute(session);
      r.items.forEach(i => record(i.id, i.status === "ok")); saveStats();
      const h = store.get(KEYS.history) || [];
      h.unshift({ date: session.finishedAt, ok: r.ok, total: r.total, pct: r.pct });
      store.set(KEYS.history, h.slice(0, 10));
    }
    closeDialog();
    reviewFilter = "wrong"; celebrate = true;
    go("results");
  }

  /* ---------------- Navigation entre vues ---------------- */
  function go(v) {
    view = v;
    if (v !== "quiz" && v !== "review") stopTimer();
    render();
    window.scrollTo(0, 0);
  }
  function render() {
    // En examen, l'interface passe en version dépouillée (classe .exam).
    app.className = session && session.mode === "exam" && (view === "quiz" || view === "review") ? "exam" : "";
    if (view === "quiz" && session) renderQuiz();
    else if (view === "review" && session) renderReview();
    else if (view === "results" && session) renderResults();
    else renderHome();
  }

  /* ======================= VUE : ACCUEIL ======================= */
  function renderHome() {
    const exam = loadSession("exam"), prac = loadSession("practice");
    const history = store.get(KEYS.history) || [];
    const dkeys = Object.keys(DOMAINS);
    const counts = dkeys.map(d => QUESTIONS.filter(q => q.domain == d).length);
    const mast = dkeys.map(d => QUESTIONS.filter(q => q.domain == d && stats[q.id] && stats[q.id].ok).length);
    const errs = QUESTIONS.filter(q => stats[q.id] && !stats[q.id].ok);
    const multi = QUESTIONS.filter(q => q.correct.length > 1).length;
    const examSize = Math.min(CONFIG.examSize, QUESTIONS.length);
    const examLive = exam && !exam.finished, pracLive = prac && !prac.finished;

    const examBlock = examLive
      ? `<div class="note"><p class="small"><strong>Examen en cours</strong> : ${Object.keys(exam.answers).filter(k => exam.answers[k].length).length} réponse(s) sur ${exam.ids.length}, <span class="num">${clock(exam.remainingMs)}</span> restantes.</p>

  function selectedDomains() { return Array.from(document.querySelectorAll("#domain-chips input:checked")).map(i => Number(i.value)); }
  function updatePracticeCount() {

  /* ======================= VUE : QUESTIONS ======================= */
  function counters() {
    const s = session;
    const done = s.mode === "exam"
      ? s.ids.filter(id => (s.answers[id] || []).length).length
      : s.ids.filter(id => s.validated[id]).length;
    return { done, left: s.ids.length - done, flagged: s.ids.filter(id => s.flags[id]).length };
  }
  // Le bandeau est construit une fois ; ensuite seules ses valeurs changent (la barre s'anime).
  function topbarHTML() {
    const s = session;
    return `
      <div class="row spread">
        <strong>${s.mode === "exam" ? "Examen blanc" : "Entraînement"}</strong>
        ${s.mode === "exam" ? `<span class="timer ${s.remainingMs < CONFIG.lowTimeMs ? "low" : ""}" id="timer" aria-label="Temps restant">${IC.clock}<span id="timer-txt">${clock(endTime ? endTime - Date.now() : s.remainingMs)}</span></span>` : ""}
        <span class="row">
          <button class="btn btn-ghost" data-action="quit">Quitter</button>
          <button class="btn" data-action="ask-finish">${s.mode === "exam" ? "Vérifier et terminer" : "Terminer"}</button>
        </span>
      </div>
      <div class="bar" id="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="${s.ids.length}" aria-label="Progression"><i id="pfill"></i></div>
      <div class="row spread small muted">
        <span>Question <span class="num" id="pcur"></span> sur <span class="num">${s.ids.length}</span></span>
        <span id="pleft"></span>
      </div>`;
  }
  function navHTML() {
    const s = session;
    return s.ids.map((id, i) => {
      const cls = [];
      if (s.mode === "practice" && s.validated[id]) cls.push(isCorrect(Q_BY_ID[id], s.answers[id]) ? "ok" : "ko");
      else if ((s.answers[id] || []).length) cls.push("answered");
      if (s.flags[id]) cls.push("flagged");
      if (i === s.current) cls.push("current");
      return `<button class="${cls.join(" ")}" data-action="goto" data-i="${i}" aria-label="Question ${i + 1}${s.flags[id] ? ", à revoir" : ""}"${i === s.current ? ' aria-current="true"' : ""}>${i + 1}</button>`;
    }).join("");
  }
  // Entraînement : score courant et série de bonnes réponses consécutives.
  function streakInfo() {
    const s = session, log = s.log || [];
    const good = id => isCorrect(Q_BY_ID[id], s.answers[id]);
    let streak = 0; for (let i = log.length - 1; i >= 0 && good(log[i]); i--) streak++;
    return { done: log.length, ok: log.filter(good).length, streak };
  }
  function refreshChrome() {     // met à jour bandeau + grille sans toucher à la question (garde le focus)
    const s = session, c = counters(), $ = id => document.getElementById(id);
    if ($("pfill")) {
      $("pfill").style.width = pct(c.done, s.ids.length) + "%";
      $("pbar").setAttribute("aria-valuenow", c.done);
      $("pcur").textContent = s.current + 1;
      const base = `<span class="num">${c.left}</span> restante${c.left > 1 ? "s" : ""}${c.flagged ? ` · <span class="num">${c.flagged}</span> à revoir` : ""}`;
      const st = s.mode === "practice" ? streakInfo() : null;
      $("pleft").innerHTML = st && st.done
        ? `<span class="num">${st.ok}/${st.done}</span> justes${st.streak >= 2 ? ` · série de <span class="num">${st.streak}</span>` : ""} · ${base}` : base;
    }
    if ($("nav-grid")) $("nav-grid").innerHTML = navHTML();
  }

  function renderQuiz() {
    const s = session, id = s.ids[s.current], q = Q_BY_ID[id];
    const multi = q.correct.length > 1;
    const sel = s.answers[id] || [];
    const locked = s.mode === "practice" && !!s.validated[id];
    const last = s.current === s.ids.length - 1;
    const good = locked && isCorrect(q, sel);

    const options = s.order[id].map((orig, pos) => {
      const chosen = sel.includes(orig), right = q.correct.includes(orig);
      let cls = "opt" + (multi ? " sq" : ""), verdict = "", mark = LETTERS[pos];
      if (locked) {
        cls += " locked";
        if (right) { cls += " is-correct"; mark = IC.check; verdict = `<span class="verdict">${chosen ? "Bonne réponse, tu l'as choisie" : "Bonne réponse"}</span>`; }
        else if (chosen) { cls += " is-wrong"; mark = IC.cross; verdict = `<span class="verdict">Ton choix, incorrect</span>`; }
      }
      return `<label class="${cls}">
        <input class="sr" type="${multi ? "checkbox" : "radio"}" name="opt" id="opt-${pos}" value="${orig}" aria-label="Option ${LETTERS[pos]}" ${chosen ? "checked" : ""} ${locked ? "disabled" : ""}>
        <span class="letter">${mark}</span>
        <span>${fmt(q.options[orig])}${verdict}</span>

    // Le squelette (bandeau + grille) n'est créé qu'une fois par session affichée.

        </details>

    }

    document.getElementById("qslot").innerHTML = `
      <article class="card qcard ${slide ? "enter-" + slide : ""}">

        ${locked ? `<div class="feedback ${good ? "ok" : "ko"}" role="status">
            <strong>${good ? IC.check + "Correct" + (streakInfo().streak >= 3 ? " · " + streakInfo().streak + " d'affilée" : "") : IC.cross + "Pas tout à fait"}</strong>
            <p>${fmt(q.explain)}</p></div>` : ""}
        <div class="row spread actions">
          <button class="btn btn-ghost" data-action="prev" ${s.current === 0 ? "disabled" : ""}>${IC.prev} Précédente</button>
          <button class="btn btn-flag" data-action="flag" aria-pressed="${!!s.flags[id]}">${IC.flag}<span>${s.flags[id] ? "Marquée" : "À revoir"}</span></button>
          ${s.mode === "practice" && !locked
            ? `<button class="btn btn-primary" data-action="validate" id="btn-validate" ${sel.length ? "" : "disabled"}>Valider ${IC.check}</button>`
            : last

  /* ============ VUE : VÉRIFICATION AVANT ENVOI (examen uniquement) ============ */

  /* ======================= VUE : RÉSULTATS ======================= */
  function renderResults() {
    const s = session, r = compute(s);
    const passed = r.pct >= CONFIG.passPct;
    const usedMs = s.mode === "exam" ? CONFIG.examMinutes * 60000 - (s.remainingMs || 0) : 0;
    const empty = r.items.filter(i => i.status === "empty").length;
    const wrong = r.items.filter(i => i.status !== "ok");
    const flagged = r.items.filter(i => i.flagged);
    const list = reviewFilter === "wrong" ? wrong : reviewFilter === "flagged" ? flagged : r.items;
    const CIRC = 2 * Math.PI * 52;

    // Domaine le plus faible (parmi ceux qui ont des questions)
    const doms = Object.keys(DOMAINS).filter(d => r.byDomain[d].total);
    const weakest = doms.slice().sort((a, b) => pct(r.byDomain[a].ok, r.byDomain[a].total) - pct(r.byDomain[b].ok, r.byDomain[b].total))[0];
    const weakPct = weakest ? pct(r.byDomain[weakest].ok, r.byDomain[weakest].total) : 100;

    const reviewHTML = list.map(it => {
      const q = it.q, n = s.ids.indexOf(it.id) + 1;
      const opts = s.order[it.id].map(orig => {
        const chosen = it.a.includes(orig), right = q.correct.includes(orig);
        const cls = right ? "is-correct" : chosen ? "is-wrong" : "";
        const note = right ? (chosen ? "Bonne réponse, choisie" : "Bonne réponse") : chosen ? "Ton choix, incorrect" : "";
        return `<li class="${cls}">${note ? `<small>${note}</small>` : ""}${fmt(q.options[orig])}</li>`;
      }).join("");
      const st = it.status === "ok" ? ["ok", "Juste"] : it.status === "ko" ? ["ko", "Fausse"] : ["ko", "Sans réponse"];
      return `<details class="review-item">
        <summary><span class="num muted">${n}.</span><span style="flex:1">${fmt(q.q.length > 150 ? q.q.slice(0, 150) + "…" : q.q)}</span><span class="st ${st[0]}">${st[1]}${it.flagged ? " · à revoir" : ""}</span></summary>
        <div class="review-body">
          <span class="tag dtag d${q.domain}" style="align-self:flex-start">Domaine ${q.domain} · ${esc(DOMAINS[q.domain].short)}</span>
          <p>${fmt(q.q)}</p>
          <ul>${opts}</ul>
          <div class="feedback ${it.status === "ok" ? "ok" : "ko"}"><strong>Explication</strong><p>${fmt(q.explain)}</p></div>
        </div>
      </details>`;
    }).join("");

    app.innerHTML = `
    <div class="strip"></div>
    <main class="wrap ${celebrate ? "stagger" : ""}">
      <header style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
        <span class="tag">${s.mode === "exam" ? "Examen blanc" : "Entraînement libre"} · résultats</span>

      <section class="card" aria-label="Score global">
        <div class="score">
          <div class="ringbox">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle class="ring-bg" cx="60" cy="60" r="52"/>
              <circle class="ring-fg ${passed ? "ok" : "ko"}" cx="60" cy="60" r="52" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC * (1 - r.pct / 100)}" style="--c:${CIRC}"/>
            </svg>
            <span class="big" id="big-pct">${r.pct} %</span>
          </div>
          <div class="score-side">
            <span class="pill ${passed ? "ok" : "ko"}">${passed ? IC.check + "Au-dessus du seuil" : IC.cross + "Sous le seuil"} de ${CONFIG.passPct} %</span>
            <span style="font:500 1.3rem var(--font-display)"><span class="num">${r.ok} / ${r.total}</span> bonnes réponses</span>
            <div class="facts">
              ${s.mode === "exam" ? `<span class="fact">Temps utilisé <b>${clock(usedMs)}</b></span>` : ""}
              ${empty ? `<span class="fact"><b>${empty}</b> sans réponse</span>` : ""}
              <span class="fact"><b>${flagged.length}</b> à revoir</span>
            </div>
          </div>

      </section>

      <section class="card" aria-labelledby="h-bydom">
        <div class="row spread"><h2 id="h-bydom">Performance par domaine</h2><span class="small muted">Trait vertical : seuil de ${CONFIG.passPct} %</span></div>
        ${doms.map(d => { const b = r.byDomain[d], p = pct(b.ok, b.total); return `
          <div class="dom d${d}">
            <span class="dnum">${d}</span>
            <span>${esc(DOMAINS[d].name)}${d === weakest && p < CONFIG.passPct ? ` <span class="pill ko" style="font-size:.75rem;padding:2px 10px">Point faible</span>` : ""}</span>
            <span class="num res">${b.ok}/${b.total} · ${p} %</span>
            <div class="bar"><i class="${p >= CONFIG.passPct ? "ok" : "ko"}" style="width:${p}%"></i></div>

        ${weakest && weakPct < CONFIG.passPct
          ? `<div class="row"><button class="btn" data-action="train-domain" data-domain="${weakest}">${IC.target} S'entraîner sur le domaine ${weakest}</button></div>` : ""}

      </section>

      <div class="row">
        <button class="btn btn-primary" data-action="${s.mode === "exam" ? "new-exam" : "home"}">${s.mode === "exam" ? "Nouvel examen blanc" : "Nouvelle session"} ${IC.next}</button>
        <button class="btn" data-action="home">Retour à l'accueil</button>
      </div>
    </main>`;

    if (celebrate) {
      celebrate = false;
      countUp(document.getElementById("big-pct"), r.pct, " %");
      if (passed && r.total >= 5) confetti();
    }
  }

  /* ---------------- Effets : compteur, confettis, onde au clic, parallaxe ---------------- */
  function countUp(el, to, suffix) {
    if (!el || REDUCED) return;
    const t0 = performance.now();
    (function frame(t) {
      const k = Math.min(1, (t - t0) / 700);
      el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + suffix;
      if (k < 1) requestAnimationFrame(frame);
    })(t0);
  }
  function confetti() {
    if (REDUCED) return;
    const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
    const ctx = c.getContext("2d"), W = c.width = window.innerWidth, H = c.height = window.innerHeight;
    const cols = ["#4285f4", "#ea4335", "#fbbc04", "#34a853"];
    const P = Array.from({ length: 60 }, (_, i) => ({
      x: W / 2 + (Math.random() - .5) * W * .3, y: H * .4,
      vx: (Math.random() - .5) * 10, vy: -Math.random() * 10 - 3,
      s: 6 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      c: cols[i % 4], round: Math.random() < .4
    }));
    const t0 = performance.now(), LIFE = 2200;
    (function frame(t) {
      const el = t - t0;
      ctx.clearRect(0, 0, W, H);
      P.forEach(p => {
        p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.globalAlpha = Math.max(0, Math.min(1, (LIFE - el) / 800)); ctx.fillStyle = p.c;
        if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, 7); ctx.fill(); } else ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66);
        ctx.restore();
      });
      if (el < LIFE) requestAnimationFrame(frame); else c.remove();
    })(t0);
  }
  document.addEventListener("pointerdown", e => {          // onde Material au point de contact
    if (REDUCED) return;
    const el = e.target.closest(".btn, .opt:not(.locked), .nav-grid button, .chip span");
    if (!el || el.disabled) return;
    const r = el.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2;
    const s = document.createElement("span"); s.className = "ripple";
    s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
    el.appendChild(s); s.addEventListener("animationend", () => s.remove());
  });
  document.addEventListener("pointermove", e => {          // les formes de l'accueil suivent le pointeur
    const hero = document.getElementById("hero"); if (!hero || REDUCED) return;
    const r = hero.getBoundingClientRect();
    hero.style.setProperty("--px", ((e.clientX - r.left) / r.width - .5).toFixed(3));
    hero.style.setProperty("--py", ((e.clientY - r.top) / r.height - .5).toFixed(3));
  });

  /* ---------------- Boîte de dialogue intégrée (confirm() est bloqué dans la page) ---------------- */
  let lastFocus = null;
  function openDialog(title, body, confirmLabel, action) {
    lastFocus = document.activeElement;
    overlay.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">${title}</h2><p class="muted">${body}</p>
      <div class="row" style="justify-content:flex-end">
        <button class="btn btn-ghost" data-action="close-dialog">Annuler</button>
        <button class="btn btn-primary" data-action="${action}" id="dlg-ok">${confirmLabel}</button>
      </div></div>`;
    overlay.hidden = false;
    document.getElementById("dlg-ok").focus();
  }
  function closeDialog() { overlay.hidden = true; overlay.innerHTML = ""; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); lastFocus = null; }

  /* ---------------- Actions ---------------- */
  function startExam() {
    closeDialog();
    session = newSession("exam", drawExam());
    store.set(KEYS.exam, session);
    go("quiz"); startTimer();
  }
  function startPractice(domains) {
    const qs = shuffle(QUESTIONS.filter(q => domains.includes(q.domain)));
    if (!qs.length) return;
    session = newSession("practice", qs, domains);
    store.set(KEYS.practice, session);
    go("quiz");
  }
  function move(i) {
    const to = Math.max(0, Math.min(session.ids.length - 1, i));
    slide = to > session.current ? "next" : to < session.current ? "prev" : "";
    session.current = to;
    view = "quiz"; save(); render(); window.scrollTo(0, 0);
  }

  const actions = {
    "new-exam": startExam,
    "ask-new-exam": () => openDialog("Abandonner l'examen en cours ?", "Tes réponses actuelles seront effacées et un nouveau tirage de questions commencera.", "Nouvel examen", "new-exam"),
    "new-practice": () => startPractice(selectedDomains()),
    "new-errors": () => {                                    // rejoue les questions ratées à la dernière tentative
      const qs = shuffle(QUESTIONS.filter(q => stats[q.id] && !stats[q.id].ok));
      if (!qs.length) return;
      session = newSession("practice", qs); store.set(KEYS.practice, session); go("quiz");
    },
    "train-domain": el => startPractice([Number(el.dataset.domain)]),
    "resume": el => { session = loadSession(el.dataset.mode); if (!session || session.finished) { session = null; return renderHome(); } go("quiz"); startTimer(); },
    "show-results": el => { session = loadSession(el.dataset.mode); if (session) { reviewFilter = "wrong"; go("results"); } },
    "home": () => { session = null; go("home"); },
    "quit": () => { save(); session = null; go("home"); },   // la session reste enregistrée pour être reprise
    "prev": () => move(session.current - 1),
    "next": () => move(session.current + 1),
    "goto": el => move(Number(el.dataset.i)),
    "flag": el => {
      const id = session.ids[session.current];
      if (session.flags[id]) delete session.flags[id]; else session.flags[id] = true;
      save();
      el.setAttribute("aria-pressed", String(!!session.flags[id]));
      el.querySelector("span").textContent = session.flags[id] ? "Marquée" : "À revoir";
      refreshChrome();
    },
    "validate": () => {
      const id = session.ids[session.current];
      if (!(session.answers[id] || []).length) return;
      session.validated[id] = true; (session.log = session.log || []).push(id);
      record(id, isCorrect(Q_BY_ID[id], session.answers[id])); saveStats();
      save(); renderQuiz();
    },
    "ask-finish": () => {
      if (session.mode === "exam") { preFilter = "all"; return go("review"); }
      const c = counters();
      if (session.mode === "practice" && !Object.keys(session.validated).length) { store.del(KEYS.practice); session = null; return go("home"); }
      const body = session.mode === "exam"
        ? (c.left ? `Il reste <strong>${c.left}</strong> question${c.left > 1 ? "s" : ""} sans réponse` : "Tu as répondu à toutes les questions") +
          (c.flagged ? ` et <strong>${c.flagged}</strong> marquée${c.flagged > 1 ? "s" : ""} à revoir` : "") + ". Tu ne pourras plus modifier tes réponses."
        : `Les résultats porteront sur les <strong>${c.done}</strong> question${c.done > 1 ? "s" : ""} validée${c.done > 1 ? "s" : ""}.`;
      openDialog(session.mode === "exam" ? "Terminer l'examen ?" : "Terminer la session ?", body, "Voir les résultats", "finish");
    },
    "back-quiz": () => go("quiz"),
    "ask-submit": () => {
      const c = counters();
      openDialog("Soumettre l'examen ?", (c.left ? `Il reste <strong>${c.left}</strong> question${c.left > 1 ? "s" : ""} sans réponse. ` : "") + "Tu ne pourras plus modifier tes réponses.", "Soumettre", "finish");
    },
    "finish": () => finish(false),
    "close-dialog": closeDialog
  };

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-action]");
    if (el && !el.disabled && actions[el.dataset.action]) actions[el.dataset.action](el);
    else if (e.target === overlay) closeDialog();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !overlay.hidden) closeDialog(); });

  // Raccourcis clavier pendant les questions : A-E ou 1-5, Entrée, flèches.
  document.addEventListener("keydown", e => {
    if (view !== "quiz" || !session || !overlay.hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = e.target.tagName, k = e.key.toLowerCase();
    if (k.length === 1) {
      const pos = "abcde".indexOf(k) >= 0 ? "abcde".indexOf(k) : "12345".indexOf(k);
      const input = document.querySelectorAll('input[name="opt"]')[pos];
      if (pos >= 0 && input && !input.disabled) { input.click(); e.preventDefault(); }
    } else if (k === "enter" && tag !== "BUTTON" && tag !== "SUMMARY") {
      const b = document.querySelector('#qslot [data-action="validate"]:not(:disabled), #qslot [data-action="next"]');
      if (b) { b.click(); e.preventDefault(); }
    } else if (tag !== "INPUT" && k === "arrowright") actions.next();
    else if (tag !== "INPUT" && k === "arrowleft") actions.prev();
  });

  document.addEventListener("change", e => {
    const t = e.target;
    if (t.name === "opt" && session && view === "quiz") {            // sélection d'une réponse
      const id = session.ids[session.current];
      session.answers[id] = Array.from(document.querySelectorAll('input[name="opt"]:checked')).map(i => Number(i.value));
      save(); refreshChrome();
      const v = document.getElementById("btn-validate"); if (v) v.disabled = !session.answers[id].length;
    } else if (t.closest && t.closest("#domain-chips")) updatePracticeCount();   // filtre par domaine
    else if (t.name === "pf") { preFilter = t.value; renderReview(); }           // filtre de vérification
    else if (t.name === "rf") { reviewFilter = t.value; renderResults(); }      // filtre de correction
  });

  // Sauvegarde du temps restant quand l'onglet est quitté ou masqué.
  window.addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

  render();
})();
</script>
</body>
</html>
